# What tools/preview.py shows (docs/PREVIEW.md): an Oral-B in the middle of a session, at every size the tile offers,
# with 4 and with 6 zones, its entities chosen in the tile's options (kind entity) as Home Assistant has them here; and
# a tile whose toothbrush is not chosen yet.
tiles:
  - tile: brush
    name: Oral-B iO
    options: &oralb
      brush: sensor.oral_b_io_toothbrush_state
      sector: sensor.oral_b_io_sector
      time: sensor.oral_b_io_time
      battery: sensor.oral_b_io_battery
      pressure: sensor.oral_b_io_pressure
      mode: sensor.oral_b_io_mode
      head: sensor.oral_b_io_refill_days
      last: sensor.oral_b_io_last_session
      zones: "4"
      routine: 120
  - tile: brush
    name: Six zones
    options: { <<: *oralb, zones: "6" }
    sizes: [2x1, 2x2]
  - tile: brush
    name: Not chosen yet
    sizes: [1x1, 2x1]

states:
  sensor.oral_b_io_toothbrush_state: { state: running }
  sensor.oral_b_io_sector: { state: sector_3 }
  sensor.oral_b_io_time: { state: "72" }
  sensor.oral_b_io_battery: { state: "78" }
  sensor.oral_b_io_pressure: { state: high }
  sensor.oral_b_io_mode: { state: daily_clean }
  sensor.oral_b_io_refill_days: { state: "41" }
  sensor.oral_b_io_last_session: { state: "{now-1d}" }
