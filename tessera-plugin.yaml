# The manifest: who made the plugin, what it may do, and what the Tessera app shows. No code and no words: every name,
# label and hint is a key into translations/<language>.json, part "app". docs/MANIFEST.md has every field.
#
# The tile's options name the toothbrush's entities (kind entity, plugin API 0.15): the app sends their states with the
# tile's data and sends the tile again when one changes, and another choice needs no build. Only the toothbrush is
# needed; the other readings show when their entity is chosen. Nothing is needed in Home Assistant.
id: toothbrush
version: 0.4.0
api: "0.15"
icon: timer-outline
maintainer: Heronimonimo
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 20

tiles:
  # The brushing zones as a ring of 4 or 6 arcs (the upper jaw above, the lower jaw below) around the time brushed.
  - id: brush
    name: tile_name
    icon: timer-outline
    sizes: { min: 1x1, max: 4x4 }
    memory: 3200
    example: tile_example
    options:
      # The brush's entities. The inspector offers every entity of the domains in a searchable list.
      - { id: brush, kind: entity, domains: [sensor, binary_sensor], label: opt_brush, hint: opt_brush_hint }
      - { id: sector, kind: entity, domains: [sensor], label: opt_sector, hint: opt_sector_hint }
      - { id: time, kind: entity, domains: [sensor], label: opt_time, hint: opt_time_hint }
      - { id: battery, kind: entity, domains: [sensor], label: opt_battery }
      - { id: pressure, kind: entity, domains: [sensor, binary_sensor], label: opt_pressure, hint: opt_pressure_hint }
      - { id: mode, kind: entity, domains: [sensor, select], label: opt_mode }
      - { id: head, kind: entity, domains: [sensor], label: opt_head, hint: opt_head_hint }
      - { id: last, kind: entity, domains: [sensor], label: opt_last, hint: opt_last_hint }
      # How it reads them.
      - id: zones
        kind: choice
        default: auto
        label: opt_zones
        hint: opt_zones_hint
        choices: [{ value: auto, label: zones_auto }, { value: "4", label: zones_4 }, { value: "6", label: zones_6 }]
      - { id: routine, kind: number, min: 60, max: 300, step: 10, unit: s, default: 120, label: opt_routine, hint: opt_routine_hint }
      - { id: hold, kind: number, min: 0, max: 24, step: 1, unit: h, default: 2, label: opt_hold, hint: opt_hold_hint }
      - id: head_unit
        kind: choice
        default: days
        label: opt_head_unit
        hint: opt_head_unit_hint
        choices: [{ value: days, label: head_days }, { value: percent, label: head_percent }, { value: sessions, label: head_sessions }]

cards:
  # The whole session over the page, opened by a tap on the tile: a large ring with the zones named, and every reading.
  - { id: zones, name: card_name, wide: true }
