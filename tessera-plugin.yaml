# The manifest: who made the plugin, what it may do, and what the Tessera app shows. No code and no words: every name,
# label and hint is a key into translations/<language>.json, part "app". docs/MANIFEST.md has every field.
#
# The screen reads the toothbrush's own entities itself. The one input names the brush's main entity, chosen once
# when the plugin is added to a screen; the component finds the brush's other entities beside it by the names their
# integration gives them. A setting may name one of them instead (the editor requires every input, so what is optional
# is a setting). Nothing is needed in Home Assistant: no template, no helper, no integration of its own.
id: toothbrush
version: 0.3.0
api: "0.10"
icon: timer-outline
maintainer: Heronimonimo
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 24

permissions:
  # The toothbrush entity, the entities of the same brush found beside it by name (<brush> is the toothbrush entity's
  # id without its integration's word for it; brush.cpp, BRANDS), and any entity a setting names instead.
  read_entities: ["{toothbrush}",
                  "sensor.<brush>_sector", "sensor.<brush>_time", "sensor.<brush>_brushing_time", "sensor.<brush>_timer",
                  "sensor.<brush>_battery", "sensor.<brush>_pressure", "sensor.<brush>_pressure_state",
                  "binary_sensor.<brush>_pressing_too_hard", "sensor.<brush>_mode", "sensor.<brush>_brushing_mode",
                  "select.<brush>_mode", "sensor.<brush>_refill_days", "sensor.<brush>_consumable",
                  "sensor.<brush>_last_session", "sensor.<brush>_score", "the entity a setting names"]

# Tessera's inputs offer every entity of their domains (an input has no filter by device or integration yet).
inputs:
  - { id: toothbrush, kind: entity, domains: [sensor, binary_sensor], scope: screen, label: in_toothbrush, hint: in_toothbrush_hint }

# Another entity for a reading, empty to find it beside the toothbrush: the text entities of plugin.yaml, by their names.
settings:
  - { key: toothbrush_zone_entity, label: set_sector, hint: set_hint }
  - { key: toothbrush_time_entity, label: set_time, hint: set_hint }
  - { key: toothbrush_battery_entity, label: set_battery, hint: set_hint }
  - { key: toothbrush_pressure_entity, label: set_pressure, hint: set_hint }
  - { key: toothbrush_mode_entity, label: set_mode, hint: set_hint }
  - { key: toothbrush_brush_head_entity, label: set_head, hint: set_head_hint }
  - { key: toothbrush_last_session_entity, label: set_last, hint: set_hint }

tiles:
  # The brushing zones as a ring of 4 or 6 arcs (the upper jaw above, the lower jaw below) around the time brushed.
  # It reads the plugin's own sensors, so it has no entity and no data of its own.
  - id: brush
    name: tile_name
    icon: timer-outline
    sizes: { min: 1x1, max: 4x4 }
    memory: 2600
    example: tile_example
    options:
      - id: zones
        kind: choice
        default: auto
        label: opt_zones
        hint: opt_zones_hint
        choices: [{ value: auto, label: zones_auto }, { value: "4", label: zones_4 }, { value: "6", label: zones_6 }]
      - { id: routine, kind: number, min: 60, max: 300, step: 10, unit: s, default: 120, label: opt_routine, hint: opt_routine_hint }
      - { id: hold, kind: number, min: 0, max: 24, step: 1, unit: h, default: 2, label: opt_hold, hint: opt_hold_hint }
      - id: head
        kind: choice
        default: days
        label: opt_head
        hint: opt_head_hint
        choices: [{ value: days, label: head_days }, { value: percent, label: head_percent }, { value: sessions, label: head_sessions }]
      - { id: show_name, kind: toggle, default: true, label: opt_show_name }

cards:
  # The whole session over the page, opened by a tap on the tile: a large ring with the zones named, and every reading.
  - { id: zones, name: card_name, wide: true }
