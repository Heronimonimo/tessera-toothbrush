# What a screen gets when it takes this plugin. Tessera includes this file from the screen's <name>.plugins.yaml with
# the entities chosen when the plugin was added (the manifest's inputs, in capitals), and adds the components folder
# beside it. Only TOOTHBRUSH is needed: the component finds the brush's other entities beside it by their names. An
# input left empty keeps its default here, "", and is found that way; one that names an entity is read instead.
defaults:
  TOOTHBRUSH: sensor.toothbrush_toothbrush_state
  SECTOR: ""
  TIME: ""
  BATTERY: ""
  PRESSURE: ""
  MODE: ""
  HEAD: ""
  LAST: ""

toothbrush:
  state: "${TOOTHBRUSH}"
  sector: "${SECTOR}"
  time: "${TIME}"
  battery: "${BATTERY}"
  pressure: "${PRESSURE}"
  mode: "${MODE}"
  head: "${HEAD}"
  last: "${LAST}"
